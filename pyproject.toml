[project]
name = "gen_koc_mm"
version = "0.1.0"
description = "Generate meeting minutes from a transcript"
requires-python = ">=3.10"

dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "python-dotenv>=1.0.1",
  "pydantic>=2.6.0",
  "openai>=1.40.0",
]

[project.scripts]
gen-koc-mm = "gen_koc_mm.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
